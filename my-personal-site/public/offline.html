<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Ember</title>
<style>
  :root{
    --bg-top:#1f1816; --bg-bottom:#120e0d;
    --ink:#f3e7d6; --muted:#9f8c7f; --line:rgba(243,185,100,.22);
    --ember:#ea7a42; --gold:#f3b964;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:24px;
    color:var(--ink);overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(90% 60% at 50% 115%, rgba(234,122,66,.16), transparent 70%),
      linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  #embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  main{position:relative;text-align:center;max-width:560px;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .status{
    display:inline-flex;align-items:center;gap:10px;padding:7px 14px;margin-bottom:28px;
    border:1px solid var(--line);border-radius:999px;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ember);animation:pulse 2.2s ease-out infinite}
  h1{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:400;
    font-size:clamp(64px,17vw,148px);line-height:.92;letter-spacing:-.025em;
  }
  h1 em{font-style:italic;color:var(--ember)}
  .sub{margin:22px auto 34px;font-size:clamp(14px,3.8vw,16px);line-height:1.65;color:var(--muted)}
  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .btn{
    font:inherit;font-size:13px;letter-spacing:.02em;padding:10px 18px;border-radius:999px;
    border:1px solid var(--line);background:transparent;color:var(--ink);
    text-decoration:none;cursor:pointer;transition:transform .2s,border-color .2s,background .2s;
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--gold)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .btn.primary{background:var(--ember);border-color:var(--ember);color:#1a100c;font-weight:600}
  .btn.primary:hover{background:#f08a55;border-color:#f08a55}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(234,122,66,.55)}
    70%{box-shadow:0 0 0 10px rgba(234,122,66,0)}
    100%{box-shadow:0 0 0 0 rgba(234,122,66,0)}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="embers" aria-hidden="true"></canvas>

<main>
  <div class="status"><span class="dot" id="dot"></span><span id="status">No connection</span></div>
  <h1>You are <em>offline</em></h1>
  <p class="sub">Connect to the net and this page will pick back up on its own.</p>
  <div class="actions">
    <button class="btn primary" id="retry" type="button">Try again</button>
    <a class="btn" href="dragon_game.html">Play dragon run</a>
  </div>
</main>

<script>
  const dot = document.getElementById('dot');
  const statusEl = document.getElementById('status');

  function paint(){
    const on = navigator.onLine;
    statusEl.textContent = on ? 'Back online' : 'No connection';
    dot.style.background = on ? '#f3b964' : '#ea7a42';
  }
  addEventListener('online', () => { paint(); setTimeout(() => location.reload(), 900); });
  addEventListener('offline', paint);
  document.getElementById('retry').addEventListener('click', () => location.reload());
  paint();

  // floating embers
  const cv = document.getElementById('embers');
  const g = cv.getContext('2d');
  let w = 0, h = 0, pts = [];

  function newEmber(init){
    return {
      x: Math.random() * w,
      y: init ? Math.random() * h : h + 10,
      r: .5 + Math.random() * 1.6,
      v: .25 + Math.random() * .6,
      p: Math.random() * 6.28
    };
  }
  function size(){
    const d = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * d; cv.height = h * d;
    g.setTransform(d, 0, 0, d, 0, 0);
  }
  function seed(){
    const n = Math.min(70, Math.round(w * h / 18000));
    pts = Array.from({ length: n }, () => newEmber(true));
  }
  function tick(t){
    g.clearRect(0, 0, w, h);
    for (const p of pts){
      p.y -= p.v;
      p.x += Math.sin(t / 900 + p.p) * .25;
      if (p.y < -8) Object.assign(p, newEmber(false));
      g.globalAlpha = .25 + .35 * Math.abs(Math.sin(t / 700 + p.p));
      g.fillStyle = p.r > 1.4 ? '#f3b964' : '#ea7a42';
      g.beginPath();
      g.arc(p.x, p.y, p.r, 0, 6.283);
      g.fill();
    }
    g.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  addEventListener('resize', () => { size(); seed(); });
  size(); seed();
  requestAnimationFrame(tick);
</script>
</body>
</html>
